# create a workflow with manual trigger to run on ubuntu latest  and checkout the code install python 3.11 and and build the artifact and upload it to the workflow artifacts
name: Basic CI
on:
  workflow_dispatch: # manual trigger
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --only-binary :all: -r ./requirements.txt
      - name: Run tests with coverage
        run: |
          pytest
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@e44258b109568baa0df60ed515909fc6c72cba92 # v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Build artifact
        run: |
          mkdir -p dist
          cp -- ./*.py dist/
          cp -- ./requirements.txt ./readme.md ./dockerfile ./it_sector.txt dist/
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: my-artifact
          path: dist
  
  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: Download web-app content
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: my-artifact
           
    - name: View content
      run: ls -R

    - name: Archive site content
      uses: thedoctor0/zip-release@a24011d8d445e4da5935a7e73c1f98e22a439464
      with:
        filename: app.zip

    - name: Create GitHub release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        tag_name: ${{ github.run_number }}
        name: Release ${{ github.run_number }}
        files: ./app.zip